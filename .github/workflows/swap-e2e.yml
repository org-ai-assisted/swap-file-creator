## AI-Assisted

## Real-kernel swap e2e for swap-file-creator. Runs on a bare ubuntu-latest VM
## (NOT a container): the dist-ai CI reusable runs in an unprivileged
## debian:trixie-slim container that cannot swapon, so the real loop + mkswap +
## swapon + btrfs path needs a VM runner with sudo. Drives the dist-ai
## swap-file-creator-tests-e2e suite against this repo's checkout.

name: swap-e2e

on:
  push:
    paths:
      - 'usr/share/swap-file-creator/**'
      - '.github/workflows/swap-e2e.yml'
  pull_request:
    paths:
      - 'usr/share/swap-file-creator/**'
      - '.github/workflows/swap-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    if: vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout swap-file-creator
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          path: swap-file-creator

      - name: checkout dist-ai (e2e suite)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: org-ai-assisted/dist-ai
          ref: ai
          path: dist-ai

      - name: checkout helper-scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: Kicksecure/helper-scripts
          ref: master
          path: helper-scripts

      - name: install dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends btrfs-progs util-linux bc python3

      - name: run real-kernel swap e2e (root)
        run: |
          sudo env \
            "SWAP_FILE_CREATOR_REPO=${GITHUB_WORKSPACE}/swap-file-creator" \
            "HELPER_SCRIPTS_PATH=${GITHUB_WORKSPACE}/helper-scripts" \
            "PATH=${GITHUB_WORKSPACE}/helper-scripts/usr/bin:${PATH}" \
            "${GITHUB_WORKSPACE}/dist-ai/usr/bin/swap-file-creator-tests-e2e"
